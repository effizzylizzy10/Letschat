name: APK guard self-test and history scan
# Proves the publish guard really blocks bad APKs, and shows what it would have said about every APK ever committed.
# Nothing is built, published or released here. Runs when the guard changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/check-published-apks.sh"
      - "tools/test-publish-guard.sh"
      - "tools/scan-apk-history.sh"
      - ".github/workflows/apk-guard-selftest.yml"
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA256: F5:A5:15:F3:EA:6A:31:7B:05:9C:7F:10:7E:AE:7F:94:0B:61:95:75:58:B1:CC:57:5F:E8:07:E7:CC:FD:F7:D8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test (the guard must block a debug-signed copy and a wrong-key copy)
        run: bash tools/test-publish-guard.sh
      - name: Scan every APK ever committed
        if: always()
        run: bash tools/scan-apk-history.sh
