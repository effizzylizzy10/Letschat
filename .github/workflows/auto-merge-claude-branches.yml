name: Auto PR, merge and build for claude/* branches
# Push to any branch named claude/... and this does the rest by itself, through the GitHub API (gh CLI):
#   1. opens a pull request into main (if there is none yet)
#   2. waits for the pull request's checks (Vercel, Netlify, emulator tests ...) to finish
#   3. squash-merges it when they are green; if a check fails it stays open and this run turns red
#   4. starts the APK build(s) for what changed (native/ or client/ -> native APK, android/ -> legacy APK);
#      "Publish latest APKs to the repo" then runs by itself when a build is green
# Needed ONCE, in the repo: Settings > Actions > General > Workflow permissions =
#   "Read and write permissions" AND tick "Allow GitHub Actions to create and approve pull requests".
# (A merge made with the built-in token does not start the push-triggered builds, which is why step 4 starts them directly.)
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to open, merge and build (default: the branch this is run on)"
        required: false
concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open the pull request (or find the open one)
        id: pr
        run: |
          set -euo pipefail
          case "$BRANCH" in claude/*) ;; *) echo "::error::Only claude/* branches are merged automatically."; exit 1;; esac
          N=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            AHEAD=$(git rev-list --count "origin/main..origin/$BRANCH")
            if [ "$AHEAD" = "0" ]; then echo "Nothing to merge: $BRANCH has no new commits."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            TITLE=$(git log -1 --format=%s "origin/$BRANCH")
            N=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Opened and merged automatically from branch $BRANCH." | sed -E 's#.*/pull/([0-9]+).*#\1#')
          fi
          echo "Pull request #$N"
          echo "number=$N" >> "$GITHUB_OUTPUT"
      - name: Wait for the checks, then merge
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          N=${{ steps.pr.outputs.number }}
          sleep 45 # let the checks appear
          if gh pr checks "$N" --watch --interval 20 2>"$RUNNER_TEMP/err.txt"; then
            echo "All checks passed."
          elif grep -qi "no checks reported" "$RUNNER_TEMP/err.txt"; then
            echo "This pull request has no checks: merging."
          else
            cat "$RUNNER_TEMP/err.txt" || true
            echo "::error::A check failed, so #$N stays open. Fix the branch and push again."
            exit 1
          fi
          gh pr merge "$N" --squash --delete-branch=false
      - name: Start the APK build(s) for what changed
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          N=${{ steps.pr.outputs.number }}
          FILES=$(gh pr diff "$N" --name-only)
          if echo "$FILES" | grep -qE '^(native/|client/)'; then gh workflow run build-native-apk.yml --ref main; echo "Started: native APK build"; fi
          if echo "$FILES" | grep -qE '^android/'; then gh workflow run build-apk.yml --ref main; echo "Started: legacy APK build"; fi
