<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Letschat Africa</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0E1116" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05070A;
      overflow-x: hidden;
    }
    #root {
      min-height: 100vh;
    }
    #error-box {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a0000;
      color: #ff8080;
      font-family: monospace;
      font-size: 13px;
      padding: 16px;
      white-space: pre-wrap;
      overflow: auto;
      z-index: 9999;
    }
  </style>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel: lets the browser understand JSX directly, no build step needed -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Socket.io client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Your server config (must load before app.jsx) -->
  <script src="./config.js"></script>

  <!-- TEMPORARY: catch and display any error visibly, for debugging on mobile -->
  <script>
    window.addEventListener("error", function (e) {
      var box = document.getElementById("error-box");
      if (box) {
        box.style.display = "block";
        box.textContent = "ERROR:\n" + e.message + "\n\nFile: " + e.filename + "\nLine: " + e.lineno + ":" + e.colno + "\n\n" + (e.error && e.error.stack ? e.error.stack : "");
      }
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="error-box"></div>

  <!-- Your app, written in JSX, transformed live by Babel in the browser -->
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
