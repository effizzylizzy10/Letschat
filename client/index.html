<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Letschat Africa</title>
  <!-- Speed: open connections to the third-party hosts early, before the scripts are requested -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.socket.io" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://letschat-9tw4.onrender.com" />
  <!-- Speed: start downloading the libraries and the app right away (they are run later, in order) -->
  <link rel="preload" as="script" href="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" />
  <link rel="preload" as="script" href="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" />
  <link rel="preload" as="script" href="app.js" />
  <!-- Speed: fonts load without blocking the first paint (swap = text shows at once in a fallback font) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0E1116" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05070A; overflow: hidden; }
    #root { height: 100%; }

    /* App fills the whole screen; the footer bar sits under it, touching both edges, and carries the host badge */
    .app-shell { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
    .app-footer {
      position: relative; flex: 0 0 auto; width: 100%; box-sizing: border-box;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding: 0 18px env(safe-area-inset-bottom, 0px);
      display: flex; align-items: center;
      background: linear-gradient(180deg, #131A24 0%, #0A0E14 100%);
      border-top: 1px solid #1F2733;
      box-shadow: 0 -12px 32px rgba(53, 208, 186, 0.07);
    }
    .app-footer::before {
      content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px;
      background: linear-gradient(90deg, transparent, #35D0BA 30%, #F2B84B 70%, transparent);
      opacity: 0.8;
    }
    .app-footer-dot { width: 8px; height: 8px; border-radius: 50%; background: #35D0BA; box-shadow: 0 0 10px #35D0BA; margin-right: 10px; }
    .app-footer-text { font: 600 12px Sora, Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: #6C7A89; }

    /* every scrolling list (chats, messages, contacts, group info, profile, market) scrolls smoothly inside its own box */
    div[style*="overflow-y: auto"] { min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #2B3544 transparent; }
    /* ---- lite animations: short, subtle, CSS-only (replayed only when an element is newly added) ---- */
    @keyframes lcFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes lcFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lcPop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    #root > * { animation: lcFade .3s ease-out backwards; }
    div[style*="overflow-y: auto"] > * { animation: lcFadeUp .22s ease-out backwards; }
    div[style*="overflow-y: auto"] > *:nth-child(2) { animation-delay: .03s; }
    div[style*="overflow-y: auto"] > *:nth-child(3) { animation-delay: .06s; }
    div[style*="overflow-y: auto"] > *:nth-child(4) { animation-delay: .09s; }
    div[style*="overflow-y: auto"] > *:nth-child(5) { animation-delay: .12s; }
    div[style*="overflow-y: auto"] > *:nth-child(n+6) { animation-delay: .15s; }
    button, [role="tab"], [role="button"] { transition: transform .12s ease, opacity .15s ease, background-color .2s ease, box-shadow .2s ease; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active, [role="tab"]:active, [role="button"]:active { transform: scale(.95); }
    @media (hover: hover) { button:not(:disabled):hover { opacity: .92; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }

    /* ---- logo (login screen): static, no glow and no flip ---- */
    .lc-flip { width: 84px; height: 84px; margin: 0 auto 20px; pointer-events: none; }
    .lc-flip-inner { position: relative; width: 100%; height: 100%; }
    .lc-flip-face { position: absolute; inset: 0; width: 84px; height: 84px; border-radius: 22px; box-sizing: border-box; animation: none; box-shadow: none; }
    .lc-flip-back { display: none; }
    /* ---- "Created by" marquee on top of every main bar: slides sideways, fades out at the edges, loops by itself ---- */
    .lc-credit { overflow: hidden; white-space: nowrap; padding: 8px 0 0; pointer-events: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%); }
    .lc-credit span { display: inline-block; padding-left: 100%; font: 700 11px Sora, Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(90deg, #35D0BA, #F2B84B, #35D0BA); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: lcCredit 11s linear infinite; will-change: transform; }
    @keyframes lcCredit { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { .lc-credit { text-align: center; -webkit-mask-image: none; mask-image: none; } .lc-credit span { padding-left: 0; animation: none !important; } }
    /* ---- lite transitions + glow ---- */
    @keyframes lcBreathe { 50% { box-shadow: 0 0 0 4px rgba(53,208,186,.18), 0 0 12px rgba(53,208,186,.8); } }
    @keyframes lcSheen { from { background-position: -200% 0; } to { background-position: 200% 0; } }
    .lc-tab svg { transition: transform .25s cubic-bezier(.3,.7,.4,1.4), filter .25s ease; }
    .lc-tab span { transition: color .2s ease; }
    .lc-tab.on svg { transform: translateY(-2px) scale(1.12); filter: drop-shadow(0 0 6px rgba(53,208,186,.85)); }
    .lc-tab.on span { text-shadow: 0 0 8px rgba(53,208,186,.6); }
    input, textarea, select { transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease; }
    input:focus, textarea:focus, select:focus { border-color: #35D0BA !important; box-shadow: 0 0 0 3px rgba(53,208,186,.18), 0 0 14px rgba(53,208,186,.35) !important; }
    button:focus-visible, [role="tab"]:focus-visible, [role="button"]:focus-visible { outline: 2px solid #35D0BA; outline-offset: 2px; box-shadow: 0 0 12px rgba(53,208,186,.5); }
    @media (hover: hover) { button:not(:disabled):hover { filter: brightness(1.12) drop-shadow(0 0 6px rgba(53,208,186,.25)); } }
    div[style*="width: 13px"][style*="height: 13px"][style*="border-radius: 50%"] { animation: lcBreathe 2.4s ease-in-out infinite; }
    svg { transition: filter .2s ease; }
    img { transition: opacity .3s ease; }
    a { transition: color .2s ease, opacity .2s ease; }
    @media (prefers-reduced-motion: reduce) { .lc-tab svg, input, textarea { transition: none !important; } }
    @keyframes lcGlowText { 50% { text-shadow: 0 0 10px #35D0BA, 0 0 22px #35D0BA, 0 0 34px rgba(53,208,186,.8); } }
    .lc-glow { animation: lcGlowText 2s ease-in-out infinite; }
    .lc-plain:focus { box-shadow: none !important; border-color: transparent !important; }
    #boot { color: #9BA7B4; font-family: sans-serif; font-size: 14px; text-align: center; padding-top: 40vh; }
    #error-box {
      display: none; position: fixed; inset: 0; background: #1a0000; color: #ff8080;
      font-family: monospace; font-size: 13px; padding: 16px; white-space: pre-wrap;
      overflow: auto; z-index: 9999;
    }
  </style>

  <!-- Shows ANY problem on screen (script failed to load, runtime error, promise error) -->
  <script>
    function showErr(msg) {
      var b = document.getElementById("error-box");
      if (b) { b.style.display = "block"; b.textContent = msg; }
    }
    // capture phase (true) is required to see <script> load failures
    window.addEventListener("error", function (e) {
      if (e.target && e.target.tagName === "SCRIPT") { showErr("FAILED TO LOAD SCRIPT:\n" + e.target.src); return; }
      showErr("ERROR:\n" + e.message + "\n\nFile: " + e.filename + "\nLine: " + e.lineno + ":" + e.colno + "\n\n" + (e.error && e.error.stack ? e.error.stack : ""));
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      showErr("PROMISE ERROR:\n" + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
    });
  </script>

  <!-- Libraries (plain scripts; no build step, no Babel, no import maps) -->
  <script defer crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script defer crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer crossorigin="anonymous" src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Your server config (single source of truth: config.js; must load before the app) -->
  <script src="config.js"></script>
  <!-- Speed: wake the server now (free hosts sleep when idle) so it is ready by the time the app asks for data -->
  <script>
    (function () {
      try {
        var api = (window.LETSCHAT_CONFIG || {}).API_URL;
        if (api) fetch(api + "/api/v1/health", { cache: "no-store" }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script defer src="push.js"></script>
  <script defer src="reactions.js"></script>
</head>
<body>
  <div id="root"><div id="boot">Loading Letschat Africa…</div></div>
  <div id="error-box"></div>

  <!-- Your app, precompiled from app.jsx -->
  <script defer src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
