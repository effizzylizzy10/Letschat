  <!-- Speed: wake the server the moment the app opens (free hosts sleep when idle). It polls /health every ~1.2 s until the server answers
       (no more single 70 s wait), shows "Waking up the server" only if it takes more than 2 s, and exposes window.__lcWake() so every
       app request can wait for the server and retry instead of failing with "Failed to fetch". -->
  <script>
    (function () {
      var api = "", upAt = 0, bar = null, pending = null;
      try { api = ((window.LETSCHAT_CONFIG || {}).API_URL || "").replace(/\/$/, ""); } catch (e) {}
      if (!api) return;
      function isUp() { return upAt && Date.now() - upAt < 8 * 60 * 1000; } // after 8 quiet minutes it may be asleep again
      function hide() { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); bar = null; }
      function show() {
        if (bar || isUp() || !document.body) return;
        bar = document.createElement("div");
        bar.setAttribute("role", "status");
        bar.textContent = "Waking up the server\u2026 almost there.";
        bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:100001;padding:8px 12px;text-align:center;font:13px/1.3 Inter,Arial,sans-serif;background:#1B2B33;color:#35D0BA;padding-top:calc(8px + env(safe-area-inset-top,0px))";
        document.body.appendChild(bar);
      }
      // one health check (8 s limit); true only when the server is up AND has finished loading its data
      function probe() {
        return new Promise(function (resolve) {
          var ctl = typeof AbortController === "function" ? new AbortController() : null, done = false;
          var timer = setTimeout(function () { if (ctl) try { ctl.abort(); } catch (e) {} fin(false); }, 8000);
          function fin(v) { if (done) return; done = true; clearTimeout(timer); resolve(v); }
          fetch(api + "/api/v1/health?t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined }).then(function (r) {
            if (!r || !r.ok) return fin(false);
            return r.json().then(function (j) { var d = (j && j.data) || j || {}; fin(d.ready !== false); }, function () { fin(true); });
          }).catch(function () { fin(false); });
        });
      }
      // wake(force): resolves true when the server answers, false after 100 s. Many callers share one polling loop.
      function wake(force) {
        if (!force && isUp()) return Promise.resolve(true);
        if (pending) return pending;
        if (force) upAt = 0;
        var t0 = Date.now(), slow = setTimeout(show, 2000);
        pending = new Promise(function (resolve) {
          (function loop() {
            probe().then(function (ok) {
              if (ok) { upAt = Date.now(); clearTimeout(slow); hide(); pending = null; return resolve(true); }
              if (Date.now() - t0 > 100000) { clearTimeout(slow); hide(); pending = null; return resolve(false); }
              setTimeout(loop, 1200);
            });
          })();
        });
        return pending;
      }
      window.__lcWake = wake;
      wake(true);
      document.addEventListener("visibilitychange", function () { if (!document.hidden && !isUp()) wake(true); });
      window.addEventListener("focus", function () { if (!isUp()) wake(true); });
      window.addEventListener("online", function () { wake(true); });
      window.addEventListener("pageshow", function () { if (!isUp()) wake(true); });
      // while the app is open, keep the server warm (it sleeps after 15 quiet minutes)
      setInterval(function () { if (!document.hidden) { try { fetch(api + "/api/v1/ping", { mode: "no-cors", cache: "no-store" }).then(function () { upAt = Date.now(); }, function () {}); } catch (e) {} } }, 4 * 60 * 1000);
    })();
  </script>
