<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Loop</title>
<meta name="description" content="Loop — a realtime messaging app" />
<meta name="theme-color" content="#0E1116" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Loop" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #05070A; height: 100%; overscroll-behavior: none; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, button { font-family: inherit; }
</style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "socket.io-client": "https://esm.sh/socket.io-client@4.7.5"
  }
}
</script>
</head>
<body>
<div id="root"></div>

<!-- must load before app.jsx runs -->
<script src="config.js"></script>

<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
  (async () => {
    const res = await fetch("app.jsx");
    const source = await res.text();
    const { code } = Babel.transform(source, {
      presets: ["react"],
      sourceType: "module",
      filename: "app.jsx",
    });
    const blob = new Blob([code], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);
    await import(url);
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.error("SW failed", err));
    });
  }
</script>
</body>
</html>
